<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoDeploy — Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e17;
      color: #e2e8f0;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,45,69,0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,45,69,0.25) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: fixed;
      top: -100px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-box {
      background: #111827;
      border: 1px solid #1e2d45;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(to right, #f97316, #38bdf8, #22c55e);
    }

    .login-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 12px;
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .login-title span { color: #f97316; }

    .login-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 36px;
    }

    .form-group { margin-bottom: 20px; }

    .form-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #64748b;
      display: block;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: #0a0e17;
      border: 1px solid #1e2d45;
      color: #e2e8f0;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: #f97316; }

    .btn-login {
      width: 100%;
      background: #f97316;
      color: #0a0e17;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .btn-login:hover { opacity: 0.85; }

    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
      font-size: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .footer-text {
      font-size: 11px;
      color: #1e2d45;
      text-align: center;
      margin-top: 24px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="login-box">
    <p class="login-label">// Acesso restrito</p>
    <h1 class="login-title">Auto<span>Deploy</span></h1>
    <p class="login-sub">Entre com suas credenciais para acessar o dashboard</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input class="form-input" type="text" name="username" placeholder="seu usuário" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••" required/>
      </div>
      <button class="btn-login" type="submit">→ Entrar</button>
    </form>

    <p class="footer-text">// autodeploy · aws ecs · docker · terraform</p>
  </div>

</body>
</html>
